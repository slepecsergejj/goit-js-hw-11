<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixabay Image Search</title>
  </head>
  <body>
    <header class="header">
      <form class="form">
        <input
          type="text"
          name="search-text"
          placeholder="Search images..."
          required
        />

      </form>
    </header>

    <main>
      <div class="loader"></div>
      <ul class="gallery"></ul>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
